<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Maze Navigation Array</title>
    <!-- Modern Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- TensorFlow JS & Speech Commands -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>
</head>
<body>
    <div class="background-grid"></div>

    <div class="app-container">
        <!-- Main Game Interface -->
        <main class="game-container hidden" id="game-view">
            <header class="game-header">
                <div class="radar-status">
                    <div class="pulse-ring"></div>
                    <span id="game-dist-info">RADAR ACTIVE</span>
                </div>
                <div class="instruction">
                    Movement: <b>W S A D</b> <br/> Or <b>Voice Commands</b>
                </div>
                <button class="btn btn-danger" id="btn-quit">ABORT</button>
            </header>

            <div class="canvas-wrapper">
                <canvas id="gameCanvas" width="660" height="500"></canvas>
            </div>
        </main>

        <!-- Menu Interface -->
        <aside class="menu-container glass-panel" id="menu-view">
            <h1 class="glitch-text" data-text="AUDIO MAZE">AUDIO MAZE</h1>
            <p class="subtitle">Acoustic Navigation Protocol</p>
            
            <section class="menu-section">
                <h2>Select Sector</h2>
                <div class="button-group" id="level-group">
                    <button class="btn btn-toggle active" data-val="0">Alpha</button>
                    <button class="btn btn-toggle" data-val="1">Beta</button>
                    <button class="btn btn-toggle" data-val="2">Gamma</button>
                </div>
            </section>

            <section class="menu-section">
                <h2>Sonar Density</h2>
                <div class="button-group" id="diff-group">
                    <button class="btn btn-toggle" data-val="Easy">Sparse</button>
                    <button class="btn btn-toggle active" data-val="Medium">Normal</button>
                    <button class="btn btn-toggle" data-val="Hard">Dense</button>
                </div>
            </section>

            <section class="menu-section voice-section">
                <h2>Voice Input Link</h2>
                <button class="btn btn-outline" id="btn-voice-link">Connect Microphone</button>
                <div id="voice-status" class="status-text hidden">Waiting for signal...</div>
            </section>

            <button class="btn btn-primary start-btn" id="btn-start">INITIALIZE SEQUENCE</button>
        </aside>

        <!-- Overlays -->
        <div class="overlay hidden" id="win-overlay">
            <div class="glass-panel text-center">
                <h1 class="success-text">EXIT REACHED</h1>
                <p>Navigation Successful.</p>
                <br/>
                <button class="btn btn-primary" id="btn-return">RETURN TO HUB</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
